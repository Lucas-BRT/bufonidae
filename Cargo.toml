[workspace]
resolver = "3"
members = [
    "crates/bufonidae-core",
    "crates/bufonidae-rclone",
    "crates/bufonidae-cli",
    "apps/desktop",
    "website",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Lucas-BRT/bufonidae"
publish = false

[workspace.dependencies]
bufonidae-core = { path = "crates/bufonidae-core" }
bufonidae-rclone = { path = "crates/bufonidae-rclone" }
directories = "=6.0.0"
keyring = "=4.2.0"
rpassword = "=7.5.5"
toml = "=1.2.1"
uuid = { version = "=1.29.2", features = ["v4"] }
anyhow = "=1.0.104"
# gpui is unstable between releases: pinned exactly.
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11", "font-kit"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
clap = { version = "=4.6.7", features = ["derive"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
# Beta database, pre-release version: pinned exactly.
blake3 = "=1.8.7"
turso = { version = "=0.9.0-pre.5", default-features = false }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt", "process", "io-util", "time", "sync"] }

# xattr 0.2.3 (a gpui dependency) does not build against current libc; see
# vendor/xattr/PATCHED.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
