[workspace]
resolver = "3"
members = [
    "crates/bufonidae-core",
    "crates/bufonidae-rclone",
    "crates/bufonidae-cli",
    "apps/desktop",
    "website",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Lucas-BRT/bufonidae"
publish = false

[workspace.dependencies]
bufonidae-core = { path = "crates/bufonidae-core" }
bufonidae-rclone = { path = "crates/bufonidae-rclone" }
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
