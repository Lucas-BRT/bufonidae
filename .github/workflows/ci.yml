name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Integration tests must fail, not skip, when rclone is missing.
  BUFONIDAE_REQUIRE_RCLONE: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # System libraries gpui links against (apps/desktop).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bufonidae
      # rclone is pinned like every other download, and cached by version.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: rclone
        with:
          path: ~/.local/bin/rclone
          key: rclone-1.76.0
      - if: steps.rclone.outputs.cache-hit != 'true'
        env:
          RCLONE_VERSION: "1.76.0"
          RCLONE_SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rclone.zip" \
            "https://downloads.rclone.org/v$RCLONE_VERSION/rclone-v$RCLONE_VERSION-linux-amd64.zip"
          echo "$RCLONE_SHA256  $RUNNER_TEMP/rclone.zip" | sha256sum --check --quiet -
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP"
          install -D -m 0755 "$RUNNER_TEMP/rclone-v$RCLONE_VERSION-linux-amd64/rclone" ~/.local/bin/rclone
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rclone version
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
